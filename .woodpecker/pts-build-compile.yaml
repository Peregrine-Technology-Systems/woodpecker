when:
  - event: [push, manual]
    branch: main

labels:
  agent: pts-build

depends_on: [pts-build]

steps:
  - name: build
    image: bash
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
      GH_TOKEN:
        from_secret: gh_token
    commands:
      - scripts/woodpecker/pts-build.sh
