when:
  - event: [push, manual]
    branch: main

labels:
  agent: pts-build

depends_on: [pts-build]

steps:
  - name: build
    image: bash
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - |
        # GH_TOKEN read from the CI agent hook's cached App-token mint (infra#4594) —
        # the `gh_token` GCP SM secret referenced here previously is disabled estate-wide.
        [ -s /tmp/.gh-token ] || { echo "ERROR: /tmp/.gh-token missing or empty — the hook's App-token mint didn't land on this agent this run (see agent/hooks/environment's WARN above). Not proceeding with an empty GH_TOKEN." >&2; exit 1; }
        export GH_TOKEN="$(cat /tmp/.gh-token)"
        scripts/woodpecker/pts-build.sh
