when:
  - event: manual
    branch: main

labels:
  platform: linux
  # Pin the lightweight orchestration (wake: gcloud provision + register-poll)
  # to the persistent d3ci42-local box, which the scaler never scales down and
  # spot never preempts. The previous `tier: ondemand` did not protect this:
  # ondemand agents are still scaled down mid-job by the scaler (the
  # `agent shutdown` kills on pts #471/#473 that skipped compile → no deploy),
  # and the label wasn't even taking effect (the killed wake ran on a ci-spot
  # agent). The HEAVY compile stays on the ephemeral on-demand pts-build-vm
  # (pts-build-compile.yaml, `agent: pts-build`), so the "no heavy CI on the
  # local box" rule holds — only the light provision/poll runs here.
  # Requires d3ci42-local to advertise `backend: local-d3ci42`
  # (peregrine-infrastructure#3114); must land together or this hangs pending.
  backend: local-d3ci42

steps:
  - name: wake
    image: bash
    environment:
      PTS_BUILD_SSH_KEY:
        from_secret: pts_build_ssh_key
      WOODPECKER_API_TOKEN:
        from_secret: woodpecker_api_token
      WOODPECKER_AGENT_SECRET:
        from_secret: woodpecker_agent_secret
      GH_TOKEN:
        from_secret: gh_token
    commands:
      - scripts/woodpecker/pts-wake.sh
