when:
  - event: push
    branch: main

labels:
  platform: linux
  backend: local

steps:
  - name: wake
    image: bash
    environment:
      PTS_BUILD_SSH_KEY:
        from_secret: pts_build_ssh_key
      WOODPECKER_API_TOKEN:
        from_secret: woodpecker_api_token
    commands:
      - scripts/woodpecker/pts-wake.sh
