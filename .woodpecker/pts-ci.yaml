when:
  - event: push
    branch:
      exclude: [main, "merge/*", "sync/*", "release/*"]

labels:
  platform: linux
  tier: spot

steps:
  - name: test
    image: bash
    commands:
      - scripts/woodpecker/pts-test.sh

  - name: lint
    image: bash
    commands:
      - scripts/woodpecker/pts-lint.sh
    depends_on: []
# Slack notify-status step removed (#246): Slack is being deprecated org-wide.
# CI pipeline pass/fail is already published to the bus by the woodpecker
# server's GCP Pub/Sub plugin (server/plugin/gcppubsub, #234) as
# `pipeline.success`/`failed` CloudEvents on `ci-events`. Infra alerting
# migration tracked in peregrine-infrastructure (see issue filed for this item).
# CI pipeline activated
